name: Weft distribution boundaries
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify inert package and trusted composition controls
        run: |
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_weft_installation.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_weft_distribution.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_weft_cli.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_indexed_weft_commerce.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_run_indexed_commerce_weft.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_weft_relationship_host.py
          PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_commerce_publication_lifecycle.py
      - name: Verify path admission and held execution controls
        run: |
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_decode.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_capture.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_plan.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_predicate_admission.py
          PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_corpus_schemas.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_commerce_path_oracle.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_compiler.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_commerce_path_request.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_run_commerce_path_weft.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_interval_cleanup.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_run_commerce_path_native.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_fixture.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_fixture_request.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_weft_path_fixture_source.py
          PYTHONPATH=src:tools:tests python3 -m unittest discover -s tests -p test_run_weft_path_fixture_native.py
      - name: Verify module ownership
        run: python3 tools/check_module_boundaries.py
      - name: Verify original supply-chain query bindings
        run: |
          PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_portable_commerce_evolution.py
          PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_evolution_producer.py
          PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_evolution_admission.py
          PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_evolution_plan_journal.py
          PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_local_delta_effect_plan.py
          PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_query_cases.py
          PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_weft_request.py
          PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_pack_publication_weft.py
          PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_pack_graph_release.py
