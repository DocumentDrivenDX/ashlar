name: Module import boundaries
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run the retained extended controls
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_module_boundaries.py
      - run: PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_module_boundaries.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_public_ports.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_puppy_finite_pack test_puppy_finite_local
      - run: PYTHONPATH=src:tests:tools python3 -S -W error::ResourceWarning -m unittest test_count_star_command test_commerce_query_selection test_registered_outbox_uncertain test_original_commerce_reopen
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_truss_graph_lifecycle test_truss_saved_publication test_truss_prepared test_truss_recovery test_truss_resume test_truss_continue test_truss_continue_cli
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_truss_weft_grouped_count test_truss_weft_count test_truss_join_count test_truss_join_projection test_truss_weft_related test_truss_value_projection
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_truss_relationship_filter test_truss_query_batch test_weft_compatible_cli test_truss_compatible_query test_truss_compatible_query_cli test_truss_scalar_projection test_truss_scalar_query_cli test_truss_scalar_join_projection test_truss_scalar_join_query_cli test_immutable_snapshot_memo
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_truss_graph_export_cli test_truss_singleton test_truss_record_read test_truss_record_mutation test_truss_record_update test_truss_record_delete test_local_receipt_codec test_truss_record_evolution test_truss_evolve_graph test_truss_evolution_catalog test_truss_staging_capacity test_truss_page_archive
      - run: PYTHONPATH=src:tests:tools python3 -S -W error::ResourceWarning -m unittest test_graphframes_export test_graphframes_export_setup test_graph_export_diff test_graph_export_setup
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_fabric_finite_notebook test_finite_export_configuration test_finite_export_cli_dispatch test_finite_graph_export test_pack_case_cli test_pack_case_selection test_truss_native_feed test_truss_edge_feed test_truss_graph_sql test_truss_graph_admission test_truss_typed_admission test_truss_typed_sql test_truss_scalar_binding test_truss_compatible_binding test_truss_catalog_reader test_truss_feed_sessions test_truss_feed_receipts test_truss_receipt_encoding test_truss_publication test_truss_note_publication test_truss_graph_publication test_truss_note_cli test_truss_runtime test_truss_local_setup test_truss_example test_truss_record_example test_truss_example_reader test_truss_continuation_setup test_truss_local_server test_truss_note_commands test_truss_schema_acceptance test_staging test_source_checkpoint
  diagnostic-supervision:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_otel_supervision.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_otel_worker.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_diagnostic_composition.py
  extended:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check_module_boundaries.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_exact_report.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_native_cli.py
      - run: PYTHONPATH=src:tools python3 -m unittest discover -s tests -p test_module_boundaries.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_public_ports.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_private_graph_custody_host.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_graphframes*.py'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_commerce_graphframes_installed test_commerce_graph_release_owner
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_commerce_graphframes_scenarios
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_commerce_original_scenarios.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_ashlar_host.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_cli.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_paths_host_configuration.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_related_keys_decode.py
      - run: PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_paths_keys_admission.py
      - run: PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_paths_keys_execution.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_paths_query.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_installed_path_host.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_package.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_installation.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_distribution.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_cli.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_keys_package.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_installation_mechanics.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_count_star_mechanics.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_count_star_consumer.py
      - run: PYTHONPATH=src:tests:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_count_star*.py'
      - run: PYTHONPATH=src:tests:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic_configuration.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic_installation.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic_request.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_commerce_implicit_arithmetic.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic_lifecycle.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_implicit_arithmetic_command.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_commerce_query_sources.py'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_original_commerce_publication.py'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_medical_admission
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_medical_local_configuration test_medical_journal_budget
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_publication_sources test_local_physical_carriers
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_medical_local_sources
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_read_sources
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_publication_planning
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_publication_plan
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_publication_observation
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_apply_observation test_medical_effect_proof
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_medical_runtime test_original_medical_native_session test_medical_native_phase
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_worker_capture
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_medical_local_setup test_original_medical_installation_handoff test_original_medical_local_cli test_original_medical_local_publication
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_original_commerce_local_configuration test_original_commerce_local_setup test_original_commerce_local_cli
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_evolution_stage_observer
      - run: PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_setup_private_outbox_fixture.py'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_existing_outbox_authority.py'
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_local_delta_custody.py'
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_publication_reader_binding.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_read_only_capacity test_read_only_transport_bounds test_read_only_journal_cleanup test_native_guard_row_limit
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_ordinary_query_connection.py
      - run: PYTHONPATH=src:tests:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_commerce_source_receipt.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_keys_installation.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_keys_distribution.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_paths_keys_cli.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_weft_implicit_arithmetic_cli.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_paths_profile_wiring.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_diagnostics_configuration.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_diagnostics.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_diagnostics_config_file.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_paths_diagnostics.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_host_diagnostics_cli.py

  duckdb-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install '.[duckdb]'
      - run: PYTHONPATH=src:tests:tools python3 -W error::ResourceWarning -m unittest test_duckdb_graph_export
