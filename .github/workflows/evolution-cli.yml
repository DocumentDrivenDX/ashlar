name: Evolution CLI controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-invocation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_evolution_cli.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_evolution_operator test_existing_outbox_authority test_evolution_verification test_evolution_verification_example test_evolution_prefix_observation test_evolution_prefix_preflight
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_stored_publisher
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_preflight_timing.PublisherTimingTests
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_local_delta_effect_plan.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_configured_local_read test_configured_query_aliases test_configured_weft_binding test_configured_weft_compile test_configured_weft_query
