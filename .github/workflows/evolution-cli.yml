name: Evolution CLI controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-invocation:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_evolution_cli.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_evolution_operator test_existing_outbox_authority test_evolution_verification test_evolution_singleton test_evolution_singleton_cli test_evolution_verification_example test_evolution_prefix_observation test_evolution_prefix_preflight test_request_validation_memo test_native_singleton_capture test_phase_absence test_projected_native_detail test_registered_detail_proof test_trace_native_verification
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_stored_publisher
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_medical_preflight_timing.PublisherTimingTests
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_local_delta_effect_plan.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_committed_detail_delegation
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_configured_local_read test_configured_query_aliases test_configured_weft_binding test_configured_weft_compile test_configured_weft_query test_configured_weft_projection test_configured_local_query test_configured_local_runtime test_configured_local_cli test_configured_local_graph_release
