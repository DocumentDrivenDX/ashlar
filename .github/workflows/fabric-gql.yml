name: Fabric GQL reader controls
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-reader:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_gql.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_gql_cli.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_graph_definition.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_graph_release_delta.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_private_graph_custody_builder test_commerce_export
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_commerce_export_cli
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_local_graph_export
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_graph_export_materialization_cli
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_fabric_notebook
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p 'test_fabric_http*.py'
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_ordinary_http.py
      - run: PYTHONPATH=src python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_fabric_runtime_file_scan.py
      - run: PYTHONPATH=src:tools python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_check_fabric_releases.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_fabric_pack_scenarios test_fabric_pack_preparation test_fabric_pack_delta
