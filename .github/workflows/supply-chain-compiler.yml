name: Supply-chain compiler source controls
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  portable-source-request:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_supply_chain_installed_request test_supply_chain_path_request test_supply_chain_common_requests test_supply_chain_two_hop_query test_supply_chain_native_integration test_supply_chain_binary_evidence
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_installed_oracle.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_cli.py
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_supply_chain_common_cli test_supply_chain_common_setup
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_supply_chain_configuration
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_count_star_execution.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest discover -s tests -p test_supply_chain_finite_native.py
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_finite_pack test_archaeology_graph_oracle test_ecology_graph_oracle
      - run: PYTHONPATH=src:tests python3 -S -W error::ResourceWarning -m unittest test_pack_count_star_request test_pack_count_star_oracle test_pack_count_star_reader test_pack_count_star_query test_pack_native_cli
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_finite_publication test_finite_read_interval test_retained_supply_chain_producer test_supply_chain_common_read test_supply_chain_graph_release_owner test_supply_chain_common_count_requests test_supply_chain_common_query test_supply_chain_projection_memo test_supply_chain_two_hop_count
      - run: PYTHONPATH=src:tools:tests python3 -S -W error::ResourceWarning -m unittest test_truss_indexed_commerce_request test_truss_indexed_commerce_oracle test_truss_indexed_commerce_guard test_truss_indexed_commerce_query test_truss_indexed_commerce_cli
