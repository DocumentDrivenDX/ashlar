name: Domain-pack carrier controls
on:
  push:
    branches: [main]
    paths:
      - tools/check_domain_pack_datasets.ts
      - tests/domain-pack-datasets.test.ts
      - .github/workflows/domain-pack-carriers.yml
  pull_request:
    paths:
      - tools/check_domain_pack_datasets.ts
      - tests/domain-pack-datasets.test.ts
      - .github/workflows/domain-pack-carriers.yml
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lexical-carriers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun test tests/domain-pack-datasets.test.ts
