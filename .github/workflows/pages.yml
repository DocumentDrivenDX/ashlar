name: Deploy Ashlar microsite

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/helix/02-design/models/ashlar-delta-runtime/**'
      - 'tools/generate_runtime_diagram.ts'
      - 'tools/build_schema_browser.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/helix/02-design/models/ashlar-delta-runtime/**'
      - 'tools/generate_runtime_diagram.ts'
      - 'tools/build_schema_browser.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.167.0
  UMF_SCHEMA_BROWSER_VERSION: 1.1.2

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Hugo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Version from the latest release tag
        run: |
          VERSION="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//' || true)"
          if [ -z "$VERSION" ]; then
            VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "SITE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build the UMF schema browser from npm
        run: |
          npm pack "@documentdrivendx/umf-schema-browser@${UMF_SCHEMA_BROWSER_VERSION}" --pack-destination "$RUNNER_TEMP"
          python tools/build_schema_browser.py "$RUNNER_TEMP"/documentdrivendx-umf-schema-browser-*.tgz
      - name: Build the site
        run: HUGO_PARAMS_VERSION="$SITE_VERSION" hugo --source website --destination public --cleanDestinationDir --panicOnWarning
      - name: Check the version stamp, links and navigation
        run: |
          grep -q "Ashlar ${SITE_VERSION}" website/public/index.html
          python website/scripts/check_site.py website/public
      - name: Package Pages
        if: github.event_name != 'pull_request'
        run: tar --dereference --hard-dereference --directory website/public -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
  deploy:
    timeout-minutes: 10
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
