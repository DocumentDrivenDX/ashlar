name: Deploy Ashlar microsite

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.innsigle/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.innsigle/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  INNSIGLE_REVISION: 4185eb56beb7b52beaa4a00c2fc897f93d44b939

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Checkout pinned Innsigle verifier
        uses: actions/checkout@v6
        with:
          repository: DocumentDrivenDX/innsigle
          ref: ${{ env.INNSIGLE_REVISION }}
          path: .tools/innsigle
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Hugo
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Verify signed page sources
        run: node .tools/innsigle/src/cli.mjs verify --all
      - name: Build production site
        run: hugo --source website --destination public --cleanDestinationDir --panicOnWarning
      - name: Check links, navigation and seal coverage
        run: python3 website/scripts/check_site.py website/public --require-seals
      - name: Package Pages including public issuer files
        if: github.event_name != 'pull_request'
        run: |
          tar --dereference --hard-dereference --directory website/public -cf "$RUNNER_TEMP/artifact.tar" .
          python3 - <<'PY'
          import os, tarfile
          with tarfile.open(os.path.join(os.environ['RUNNER_TEMP'], 'artifact.tar')) as archive:
              names = {member.name.removeprefix('./') for member in archive}
              assert '.well-known/innsigle/keys.json' in names
              assert sum(name.endswith('.attestation.json') for name in names) == 7
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
