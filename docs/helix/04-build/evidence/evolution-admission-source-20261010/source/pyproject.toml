[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashlar-graph-toolkit"
version = "0.1.0.dev0"
description = "Ashlar graph source, schema and publication toolkit components"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
diagnostics = [
    "opentelemetry-api==1.45.1; python_version == '3.11'",
    "opentelemetry-sdk==1.45.1; python_version == '3.11'",
    "opentelemetry-proto==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-common==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-http==1.45.1; python_version == '3.11'",
    "opentelemetry-semantic-conventions==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-http-transport==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-common==0.66b1; python_version == '3.11'",
    "protobuf==6.33.6; python_version == '3.11'",
    "requests==2.33.0; python_version == '3.11'",
    "urllib3==2.8.0; python_version == '3.11'",
    "idna==3.15; python_version == '3.11'",
    "certifi==2025.10.5; python_version == '3.11'",
    "charset-normalizer==3.4.3; python_version == '3.11'",
    "googleapis-common-protos==1.75.0; python_version == '3.11'",
    "typing-extensions==4.15.0; python_version == '3.11'",
]

[project.scripts]
ashlar = "ashlar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashlar", "ashlar.*", "ashlar_host", "ashlar_host.*"]

[tool.setuptools.package-data]
ashlar_host = ["source-correspondence.json", "resources/*.json", "resources/*.ts", "resources/sql/*/*.sql", "resources/evolution/*.json", "resources/evolution/*.gz", "resources/evolution/*.ts"]
