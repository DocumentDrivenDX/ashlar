[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
name = "ashlar-graph-toolkit"
version = "0.1.0.dev1"
description = "Ashlar graph source, schema and publication toolkit components"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
truss-local = ["truss-toolkit[local,native] @ https://github.com/DocumentDrivenDX/truss/releases/download/v0.0.50/truss_toolkit-0.0.50-py3-none-any.whl#sha256=7b0483bb0c624c98515cf38ec30bbbf1ca43c1250e8880e5d00d520b4b7eec00"]
local-delta = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
    "mini-racer==0.12.2; python_version < '3.10'",
    "mini-racer==0.14.1; python_version >= '3.10'",
]
managed-read = ["databricks-sdk==0.155.0", "psycopg[binary]==3.3.6"]
weft-validation = ["jsonschema==4.26.0", "referencing==0.37.0", "rpds-py==2026.9.1", "attrs==26.1.0", "jsonschema-specifications==2025.9.1", "typing-extensions==4.16.0"]
typed-sdk = [
    "umf-core @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-macosx_11_0_arm64.whl#sha256=49459bb2dbc37ac9b62b269e9664bac1483439c7d4c79f0b07855e9c8546c823 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "umf-core @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-linux_x86_64.whl#sha256=3512e56730d1dab59d803b20301aea3ac8f6896b0dab452f767f4c3575b9ff4c ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "umf_access @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.5/umf_access-0.1.0.dev7-py3-none-any.whl#sha256=a78053ab8f35f55f23661de780f351f90e71299773774b62938ffb09270f3597",
    "weft-sql==0.4.53",
    "mini-racer==0.12.2; python_version < '3.10'",
    "mini-racer==0.14.1; python_version >= '3.10'",
]
duckdb = ["duckdb==2.0.0"]
puppy = ["duckdb==2.0.0", "neo4j==6.4.1"]
puppy-gremlin = ["duckdb==2.0.0", "neo4j==6.4.1", "gremlinpython==3.8.2"]
diagnostics = [
    "opentelemetry-api==1.45.1; python_version == '3.11'",
    "opentelemetry-sdk==1.45.1; python_version == '3.11'",
    "opentelemetry-proto==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-common==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-http==1.45.1; python_version == '3.11'",
    "opentelemetry-semantic-conventions==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-http-transport==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-common==0.66b1; python_version == '3.11'",
    "protobuf==7.36.2; python_version == '3.11'",
    "requests==2.34.2; python_version == '3.11'",
    "urllib3==2.8.0; python_version == '3.11'",
    "idna==3.20; python_version == '3.11'",
    "certifi==2026.10.19; python_version == '3.11'",
    "charset-normalizer==3.5.2; python_version == '3.11'",
    "googleapis-common-protos==1.75.5; python_version == '3.11'",
    "typing-extensions==4.16.0; python_version == '3.11'",
]

[project.scripts]
ashlar = "ashlar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashlar", "ashlar.*", "ashlar_host", "ashlar_host.*"]

[tool.setuptools.package-data]
ashlar_host = ["source-correspondence.json", "resources/*.json", "resources/original-commerce-local/*.json", "resources/managed-delta-v03/*.json", "resources/managed-current-core-010/*.json", "resources/managed-current-core-010-xxhash64/*.json", "resources/local-current-delta4/*.json", "resources/local-current-delta4/*.js", "resources/local-current-delta4/*.ts", "resources/local-current-delta4/*.txt", "resources/*.ts", "resources/sql/*/*.sql", "resources/native/*.c", "resources/evolution/*.json", "resources/evolution/*.gz", "resources/evolution/*.ts"]
