[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashlar-graph-toolkit"
version = "0.1.0.dev0"
description = "Ashlar graph source, schema and publication toolkit components"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ashlar = "ashlar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashlar", "ashlar.*"]
