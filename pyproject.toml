[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
name = "umf-ashlar"
version = "0.1.0.dev1"
description = "Ashlar graph source, schema and publication toolkit components"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
truss-local = ["umf-truss[native] @ https://github.com/DocumentDrivenDX/truss/releases/download/v0.0.54/umf_truss-0.0.54-py3-none-any.whl#sha256=4aebc56e92fdbde6714d9b811860707d2ffc9b0edbc63cc91e9dc3488c042b52"]
local-delta = [
    "pyspark==4.2.0",
    "delta-spark==4.4.1",
    "mini-racer==0.12.2; python_version < '3.10'",
    "mini-racer==0.14.1; python_version >= '3.10'",
]
managed-read = ["databricks-sdk==0.155.0", "psycopg[binary]==3.3.6"]
weft-validation = ["jsonschema==4.26.0", "referencing==0.37.0", "rpds-py==2026.9.1", "attrs==26.1.0", "jsonschema-specifications==2025.9.1", "typing-extensions==4.16.0"]
typed-sdk = [
    "umf-core @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-rust-v0.1.0/umf_core-0.10.6-cp311-abi3-macosx_11_0_arm64.whl#sha256=e6219539dabcdfe9657bc09485ad991b3380ae306c658d0a51a35caac0196e36 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "umf-core @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-rust-v0.1.0/umf_core-0.10.6-cp311-abi3-linux_x86_64.whl#sha256=9a4fc6e739fb9c0c80e22916490484fb41b6f00985afc53fb81dcca2d72029b9 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "umf_access @ https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.8/umf_access-0.1.0.dev8-py3-none-any.whl#sha256=1a21c1ddd59f6b23e9f0b33228280564af0e96bb4d13699b89616d5143e4fd23",
    "umf-weft @ https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.56/umf_weft-0.4.56-cp39-abi3-macosx_11_0_arm64.whl#sha256=68f9297b4b55df483b86d3041040991c4dadfb9b4d63afcff1420c43f93ae41d ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "umf-weft @ https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.56/umf_weft-0.4.56-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=32f4c38d9a614dd4c3a367f8b24d5cd4ba41ec80c2a4a2e3423e2082a294dbdd ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "umf-weft @ https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.56/umf_weft-0.4.56-cp39-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl#sha256=2de2156e283c34e45154f5d9fbc83a3eb1dd43fad497d787509d66cc96cfbe5a ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "mini-racer==0.12.2; python_version < '3.10'",
    "mini-racer==0.14.1; python_version >= '3.10'",
]
duckdb = ["duckdb==2.0.0"]
puppy = ["duckdb==2.0.0", "neo4j==6.4.1"]
puppy-gremlin = ["duckdb==2.0.0", "neo4j==6.4.1", "gremlinpython==3.8.2"]
diagnostics = [
    "opentelemetry-api==1.45.1; python_version == '3.11'",
    "opentelemetry-sdk==1.45.1; python_version == '3.11'",
    "opentelemetry-proto==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-common==1.45.1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-proto-http==1.45.1; python_version == '3.11'",
    "opentelemetry-semantic-conventions==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-http-transport==0.66b1; python_version == '3.11'",
    "opentelemetry-exporter-otlp-common==0.66b1; python_version == '3.11'",
    "protobuf==7.36.2; python_version == '3.11'",
    "requests==2.34.2; python_version == '3.11'",
    "urllib3==2.8.0; python_version == '3.11'",
    "idna==3.20; python_version == '3.11'",
    "certifi==2026.10.19; python_version == '3.11'",
    "charset-normalizer==3.5.2; python_version == '3.11'",
    "googleapis-common-protos==1.75.5; python_version == '3.11'",
    "typing-extensions==4.16.0; python_version == '3.11'",
]

[project.scripts]
ashlar = "ashlar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashlar", "ashlar.*", "ashlar_host", "ashlar_host.*"]

[tool.setuptools.package-data]
ashlar_host = ["source-correspondence.json", "resources/*.json", "resources/original-commerce-local/*.json", "resources/managed-delta-v03/*.json", "resources/managed-current-core-010/*.json", "resources/managed-current-core-010-xxhash64/*.json", "resources/local-current-delta4/*.json", "resources/local-current-delta4/*.js", "resources/local-current-delta4/*.ts", "resources/local-current-delta4/*.txt", "resources/local-current-delta4-sdk058/*.json", "resources/local-current-delta4-sdk058/*.js", "resources/local-current-delta4-sdk058/*.ts", "resources/local-current-delta4-sdk058/*.txt", "resources/local-current-delta4-sdk010/*.json", "resources/local-current-delta4-sdk010/*.js", "resources/local-current-delta4-sdk010/*.ts", "resources/local-current-delta4-sdk010/*.txt", "resources/local-current-delta4-sdk0101/*.json", "resources/local-current-delta4-sdk0101/*.js", "resources/local-current-delta4-sdk0101/*.ts", "resources/local-current-delta4-sdk0101/*.txt", "resources/local-current-delta4-sdk0102/*.json", "resources/*.ts", "resources/*.mjs", "resources/sql/*/*.sql", "resources/native/*.c", "resources/evolution/*.json", "resources/evolution/*.gz", "resources/evolution/*.ts"]
